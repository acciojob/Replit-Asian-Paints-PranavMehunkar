<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asian Paints</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="grid-container">
        <div id="grid-item" class="grid-item">1</div>
        <div id="grid-item" class="grid-item">2</div>
        <div id="grid-item" class="grid-item">3</div>
        <div id="grid-item" class="grid-item">4</div>
        <div id="grid-item" class="grid-item">5</div>
        <div id="grid-item" class="grid-item">6</div>
        <div id="grid-item" class="grid-item">7</div>
        <div id="grid-item" class="grid-item">8</div>
        <div id="grid-item" class="grid-item">9</div>
    </div>

    <div class="controls">
        <input type="number" id="block_id" placeholder="Enter block ID (1-9)">
        <input type="text" id="colour_id" placeholder="Enter color">

        <button id="change_button">Change Color</button>
        <button id="Reset">Reset</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
